name: build-package
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rootfs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nsis
      - run: ./packaging/build-package.sh v2.6.0
      - uses: actions/upload-artifact@v4
        with:
          name: rootfs-and-scripts
          path: packaging/dist/*

  release:
    needs: [rootfs]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: assets, merge-multiple: true }
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp packaging/bootstrap/PolyLabLIMS-Bootstrap.cmd assets/
          gh release create "${{ github.ref_name }}" assets/* --title "PolyLab LIMS ${{ github.ref_name }}" --generate-notes
